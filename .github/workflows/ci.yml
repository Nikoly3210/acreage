name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for egui/winit
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  e2e:
    # The real app on a virtual display, driven with xdotool (see e2e/harness.py).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev xvfb x11-utils xdotool xclip imagemagick fonts-noto-core fonts-dejavu-core
      - run: cargo build --release --locked
      - run: python3 -m unittest discover -s e2e -v

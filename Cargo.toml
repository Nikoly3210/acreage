[package]
name = "acreage"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
eframe = "0.36"
egui = "0.36"
egui-phosphor = "0.14.0"
globset = "0.4.21"
inotify = "0.11.5"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
trash = "5.2.9"

[dev-dependencies]
tempfile = "3.27.0"

# Debug info for ~400 GUI dependencies costs gigabytes; keep only line tables for our crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
